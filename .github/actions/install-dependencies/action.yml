name: 'Install dependencies'
description: 'Prepare repository and all dependencies'

runs:
  using: 'composite'
  steps:
    - name: Set up pnpm
      uses: wevm/actions/vendor/pnpm/action-setup/v6@73e899a58d51092d694fbaf94b7a1d8c09bfea28

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '24.22.1'

    - name: Install dependencies
      shell: bash
      run: pnpm install
