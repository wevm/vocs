name: Publish twoslash-rust to crates.io

on:
  push:
    tags: ['twoslash-rust@*']

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: wevm/actions/vendor/rust-lang/crates-io-auth-action/rev-3268eb413133@b518cf981b50a4c745a8b7335fc693f34b108a75
        id: auth
      - run: cargo publish
        working-directory: twoslash-rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
