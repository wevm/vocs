name: Publish twoslash-rust to crates.io

on:
  push:
    tags: ['twoslash-rust@*']

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: wevm/actions/vendor/rust-lang/crates-io-auth-action/rev-3268eb413133@73e899a58d51092d694fbaf94b7a1d8c09bfea28
        id: auth
      - run: cargo publish
        working-directory: twoslash-rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
