<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spike A: the agent in a page</title>
  </head>
  <body>
    <main data-vocs="root" data-state="loading">
      <form data-vocs="ask">
        <label for="prompt">What do you want to learn?</label>
        <input id="prompt" name="prompt" autocomplete="off" required />
        <button type="submit">Ask</button>
      </form>
      <p data-vocs="status" aria-live="polite"></p>
      <output data-vocs="answer" aria-live="polite"></output>
      <dl data-vocs="metrics"></dl>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
